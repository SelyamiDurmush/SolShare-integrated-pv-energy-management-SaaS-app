version: '3.8'

services:
  backend:
    build: ./backend
    #'ports' removed because Nginx will talk to it internally on 8000
    volumes:
      - sqlite_data:/app
    restart: always

  frontend:
    build: ./frontend
    #'ports' removed because Nginx will talk to it internally on 5173
    environment:
      - BACKEND_URL=http://backend:8000
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: always

volumes:
  sqlite_data:
