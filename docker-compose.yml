version: '3.8'
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    # We mount a volume so your SQLite .db file doesn't get deleted if the container restarts
    volumes:
      - sqlite_data:/app

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - BACKEND_URL=http://backend:8000
volumes:
  sqlite_data:
