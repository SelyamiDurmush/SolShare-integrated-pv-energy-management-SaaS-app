version: '3.8'

services:
  backend:
    build: ./backend
    volumes:
      - sqlite_data:/data
    environment:
      - DATABASE_URL=sqlite:////data/solshare.db
    restart: always

  frontend:
    build: ./frontend
    environment:
      - BACKEND_URL=http://backend:8000
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: always

volumes:
  sqlite_data:
